<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mural Digital - Naturae Nutribar</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ede0d4;
      color: #2d241e;
      font-family: 'Montserrat', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
    }
    .tv-container {
      display: flex;
      width: 100%;
      height: 100%;
      padding: 3.5vh 3vw;
      gap: 3vw;
    }

    /* Coluna Esquerda: Informativa (Padrão Unificado) */
    .info-section {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(190, 117, 86, 0.35);
      border-radius: 26px;
      padding: 3.5vh 3vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(60, 40, 20, 0.08);
    }

    /* Cabeçalho */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 25px;
      padding-bottom: 2vh;
      border-bottom: 2px solid rgba(74, 103, 65, 0.2);
    }
    .header-text {
      flex: 1;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #be7556, #a85f42);
      color: #ffffff;
      font-size: clamp(0.75rem, 1vw, 1.05rem);
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 7px 20px;
      border-radius: 50px;
      margin-bottom: 1vh;
      box-shadow: 0 4px 14px rgba(190, 117, 86, 0.35);
    }
    .header h1 {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 900;
      line-height: 1.2;
      color: #2d241e;
      letter-spacing: -0.5px;
    }
    .header h1 span {
      color: #4a6741;
    }

    .logo-img {
      height: clamp(85px, 14vh, 140px);
      max-width: 260px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
    }

    /* Área de Texto Auto-Ajustável */
    .caption-container {
      flex: 1;
      margin-top: 2vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100%;
      height: 100%;
    }
    .caption-box {
      width: 100%;
      color: #2d241e;
      white-space: pre-line;
      word-break: break-word;
      line-height: 1.45;
      font-weight: 600;
    }

    /* Coluna Direita: Vídeo com Moldura Dupla */
    .video-wrapper {
      flex: 0 0 36%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame-layer-green {
      position: absolute;
      top: 1.5%;
      left: 1.5%;
      width: 97%;
      height: 97%;
      background-color: #4a6741;
      border-radius: 12px;
      transform: translate(-8px, 8px);
    }
    .frame-layer-terracotta {
      position: absolute;
      top: 1.5%;
      left: 1.5%;
      width: 97%;
      height: 97%;
      background-color: #be7556;
      border-radius: 12px;
      transform: translate(8px, 8px);
    }

    .video-card {
      position: relative;
      width: 96%;
      height: 96%;
      background: #ffffff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 15px 35px rgba(60, 40, 20, 0.15);
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .video-inner {
      width: 100%;
      height: 100%;
      background: #000000;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .progress-bar-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.25);
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #be7556, #4a6741);
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- Coluna Informativa -->
    <div class="info-section">
      <div class="header">
        <div class="header-text">
          <span class="badge">Combustível para a sua rotina saudável</span>
          <h1>Naturae <span>Nutribar</span></h1>
        </div>
        <img src="logo.png" alt="Logo Naturae Nutribar" class="logo-img" onerror="this.style.display='none'">
      </div>

      <div class="caption-container" id="caption-container">
        <div class="caption-box" id="caption-text">
          Carregando informações...
        </div>
      </div>
    </div>

    <!-- Coluna do Vídeo com Moldura Dupla -->
    <div class="video-wrapper">
      <div class="frame-layer-green"></div>
      <div class="frame-layer-terracotta"></div>
      <div class="video-card">
        <div class="video-inner">
          <video id="player" autoplay playsinline muted preload="auto">
            <source id="video-source" src="video_1.mp4" type="video/mp4">
          </video>
          <div class="progress-bar-container">
            <div class="progress-bar" id="progress"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const player = document.getElementById('player');
    const videoSource = document.getElementById('video-source');
    const progressBar = document.getElementById('progress');
    const captionContainer = document.getElementById('caption-container');
    const captionText = document.getElementById('caption-text');

    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('post')) || 1;

    let consecutiveErrors = 0;
    const maxConsecutiveErrors = 5;

    function autoFitTextExact() {
      const containerW = captionContainer.clientWidth;
      const containerH = captionContainer.clientHeight;
      
      if (!containerW || !containerH) return;

      let low = 12;
      let high = 65;
      let optimal = low;

      for (let i = 0; i < 10; i++) {
        const mid = (low + high) / 2;
        captionText.style.fontSize = mid + 'px';
        captionText.style.lineHeight = (mid * 1.38) + 'px';

        const overflowH = captionText.scrollHeight > containerH;
        const overflowW = captionText.scrollWidth > containerW;

        if (!overflowH && !overflowW) {
          optimal = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      captionText.style.fontSize = optimal + 'px';
      captionText.style.lineHeight = (optimal * 1.38) + 'px';
    }

    player.addEventListener('error', () => {
      consecutiveErrors++;
      if (consecutiveErrors >= maxConsecutiveErrors) {
        setTimeout(() => {
          window.location.reload();
        }, 3000);
      } else {
        setTimeout(() => {
          player.load();
          player.play().catch(() => {});
        }, 3000);
      }
    });

    player.addEventListener('playing', () => {
      consecutiveErrors = 0;
    });

    async function loadPostData() {
      const timestamp = new Date().getTime();
      try {
        const res = await fetch(`data.json?t=${timestamp}`);
        const posts = await res.json();
        
        const currentPost = posts.find(p => p.id === postId) || posts[0];
        
        captionText.innerText = currentPost.caption;

        requestAnimationFrame(() => {
          autoFitTextExact();
        });

        videoSource.src = `${currentPost.video_file}?t=${timestamp}`;
        player.load();
        player.play().catch(e => console.log('Autoplay:', e));
      } catch (e) {
        console.log('Erro ao carregar dados:', e);
      }
    }

    window.addEventListener('resize', autoFitTextExact);

    player.addEventListener('timeupdate', () => {
      if (player.duration) {
        const pct = (player.currentTime / player.duration) * 100;
        progressBar.style.width = pct + '%';
      }
    });

    player.addEventListener('ended', () => {
      player.currentTime = 0;
      player.play().catch(e => console.log('Erro ao reiniciar:', e));
    });

    loadPostData();
  </script>
</body>
</html>
